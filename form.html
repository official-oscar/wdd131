<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Submit a product review for WDD131. Rate products, add features, and share your feedback.">
    <meta name="author" content="Osarugue Uwagboe">
    <title>Product Review Form | WDD131</title>

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <div class="form-group">
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required autocomplete="off">
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset>
                <legend>Overall Rating</legend>
                <div class="rating">
                    <label for="rating5">☆☆☆☆☆ <input type="radio" id="rating5" name="rating" value="5" required></label>
                    <label for="rating4">☆☆☆☆ <input type="radio" id="rating4" name="rating" value="4"></label>
                    <label for="rating3">☆☆☆ <input type="radio" id="rating3" name="rating" value="3"></label>
                    <label for="rating2">☆☆ <input type="radio" id="rating2" name="rating" value="2"></label>
                    <label for="rating1">☆ <input type="radio" id="rating1" name="rating" value="1"></label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required autocomplete="off">
            </div>

            <fieldset>
                <legend>Which features do you like?</legend>

                <div class="checkbox-group">
                    <input type="checkbox" id="durability" name="features" value="durability">
                    <label for="durability">Durability</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="ease" name="features" value="ease">
                    <label for="ease">Ease of Use</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="performance" name="features" value="performance">
                    <label for="performance">Performance</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="design" name="features" value="design">
                    <label for="design">Design</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="writtenReview">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview" rows="4" autocomplete="off"></textarea>
            </div>

            <div class="form-group">
                <label for="userName">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="userName" name="userName" autocomplete="name">
            </div>

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>©2026 🌴 Osarugue Uwagboe 🌴 <br> Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
